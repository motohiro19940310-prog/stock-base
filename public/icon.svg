<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#09090b"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- アクセントライン -->
  <rect x="64" y="320" width="160" height="6" rx="3" fill="url(#green)" opacity="0.4"/>
  <rect x="64" y="344" width="100" height="6" rx="3" fill="url(#green)" opacity="0.2"/>

  <!-- S -->
  <text
    x="80"
    y="290"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="240"
    fill="url(#green)"
    letter-spacing="-8"
  >S</text>

  <!-- B -->
  <text
    x="238"
    y="290"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="240"
    fill="white"
    opacity="0.92"
    letter-spacing="-8"
  >B</text>

  <!-- ドット装飾 -->
  <circle cx="420" cy="96" r="12" fill="url(#green)" opacity="0.6"/>
  <circle cx="448" cy="96" r="6" fill="url(#green)" opacity="0.3"/>
</svg>
